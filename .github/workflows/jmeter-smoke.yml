name: JMeter Smoke (PR)

on:
  pull_request:
    paths:
      - "jmeter/**"
      - "scripts/jmeter-ci.sh"
      - ".github/workflows/jmeter-smoke.yml"
  push:
    branches: [main, master]
    paths:
      - "jmeter/**"
      - "scripts/jmeter-ci.sh"
      - ".github/workflows/jmeter-smoke.yml"

concurrency:
  group: jmeter-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: BlazeDemo smoke load
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache JMeter
        uses: actions/cache@v4
        with:
          path: .tools/apache-jmeter-5.6.3
          key: jmeter-5.6.3-linux

      - name: Run smoke test (5 VUs, 30s)
        run: |
          chmod +x scripts/jmeter-ci.sh
          # 0% de erro exigido — valida script e disponibilidade basica do alvo
          scripts/jmeter-ci.sh 5 10 30 pr-smoke 0

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-smoke-report
          path: |
            results/ci-pr-smoke.jtl
            reports/ci-pr-smoke/
          retention-days: 14
